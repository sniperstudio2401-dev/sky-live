<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Sky Live</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Widgets/widgets.css">
<style>
  :root{--glass:rgba(10,16,30,.72);--line:rgba(140,170,220,.18);--txt:#e8eef9;--mut:#93a3bf;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05080f;color:var(--txt);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #globe{position:fixed;inset:0}
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;padding:9px 12px;max-width:calc(100vw - 20px);cursor:pointer}
  #hud .t{font-weight:700;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  #hud .t b{color:var(--acc);font-weight:700}
  #hud .t .chev{color:var(--mut);font-size:12px}
  #hud .s{color:var(--mut);font-size:12px;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px currentColor;flex:none}
  .dot.live{background:var(--ok);color:var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  #ctrls{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;padding:6px}
  #ctrls button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font-size:17px;display:grid;place-items:center;cursor:pointer}
  #ctrls button.on{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.5)}
  #ctrls button small{font-size:10px;font-weight:600}
  #caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom));padding:10px 16px;text-align:center;display:none;max-width:calc(100vw - 20px)}
  #caption.on{display:block;animation:rise .6s ease}
  #caption .a{font-size:12px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
  #caption .b{font-size:22px;font-weight:800;letter-spacing:.5px;margin-top:2px}
  #caption .c{font-size:13px;color:#cfe0f5;margin-top:2px}
  @keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  #legend{position:fixed;left:10px;bottom:calc(30px + env(safe-area-inset-bottom));padding:7px 10px;font-size:11px;color:var(--mut)}
  #legend .bar{width:150px;height:6px;border-radius:3px;margin:4px 0 2px;background:linear-gradient(90deg,#ff8a3d,#ffd166,#7ee8a1,#38bdf8,#a78bfa)}
  #legend .ticks{display:flex;justify-content:space-between}
  #card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));width:min(360px,calc(100vw - 20px));padding:12px 14px;display:none}
  #card.on{display:block}
  #card .h{display:flex;align-items:center;gap:8px}
  #card .cs{font-size:20px;font-weight:800;letter-spacing:.5px}
  #card .ty{color:var(--mut);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  #card .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
  #card .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  #card .g div{background:rgba(255,255,255,.04);border-radius:10px;padding:7px 8px}
  #card .g span{display:block;color:var(--mut);font-size:11px}
  #card .g b{font-size:15px}
  #card .row{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:rgba(56,189,248,.15);color:var(--txt);font:inherit;font-weight:600;cursor:pointer}
  #picker{position:fixed;inset:0;background:rgba(3,6,12,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(60px + env(safe-area-inset-top)) 10px 10px;z-index:10}
  #picker.on{display:flex}
  #picker .p{width:min(420px,100%);padding:14px}
  #picker h3{margin:0 0 10px;font-size:15px}
  #q{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;font-size:15px;outline:none}
  #q:focus{border-color:rgba(56,189,248,.6)}
  #res{margin-top:8px;max-height:46vh;overflow:auto}
  .opt{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer}
  .opt:hover,.opt:active{background:rgba(255,255,255,.06)}
  .opt .f{font-size:20px;width:26px;text-align:center}
  .opt .n{font-weight:600}
  .opt .c{color:var(--mut);font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
  .sec{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:12px}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#05080f;color:var(--mut);transition:opacity .8s;z-index:20}
  #loading.gone{opacity:0;pointer-events:none}
  .cesium-viewer-bottom{transform:scale(.8);transform-origin:left bottom;opacity:.7}
  .cesium-widget-credits{font-size:10px}
</style>
</head>
<body>
<div id="globe"></div>

<div id="hud" class="glass" title="Change place">
  <div class="t"><span class="dot" id="dot"></span>Sky Live · <b id="placeName">…</b><span class="chev">▾</span></div>
  <div class="s" id="status">Starting…</div>
</div>

<div id="ctrls" class="glass">
  <button id="bHome" title="Back to my place">⌂</button>
  <button id="bRange" title="Range"><small id="rangeTxt">280km</small></button>
  <button id="bLabels" title="Flight labels">🏷</button>
  <button id="bLight" title="Real day/night lighting">☀</button>
  <button id="bHd" title="HD sharpness (off saves battery)"><small>HD</small></button>
  <button id="bCine" title="Cinematic tour">🎬</button>
  <button id="bSky" title="Look up from your city">🔭</button>
  <button id="bSound" title="Engine sound">🔇</button>
</div>

<div id="legend" class="glass">Altitude<div class="bar"></div><div class="ticks"><span>0</span><span>10k</span><span>20k</span><span>30k</span><span>40k ft</span></div></div>

<div id="caption" class="glass"><div class="a" id="capA"></div><div class="b" id="capB"></div><div class="c" id="capC"></div></div>

<div id="card" class="glass">
  <div class="h"><span class="cs" id="cCs">—</span><span class="ty" id="cTy">—</span><button class="x" id="cX">×</button></div>
  <div class="g">
    <div><span>Altitude</span><b id="cAlt">—</b></div>
    <div><span>Speed</span><b id="cSpd">—</b></div>
    <div><span>Heading</span><b id="cHdg">—</b></div>
  </div>
  <div class="row"><button class="btn" id="cFly">🎥 Follow</button></div>
</div>

<div id="picker">
  <div class="p glass">
    <h3>Choose a place</h3>
    <input id="q" placeholder="Search a city or country…" autocomplete="off">
    <div id="res"></div>
    <div class="sec">Quick picks</div>
    <div class="chips" id="chips"></div>
    <div class="chips"><button class="chip" id="useLoc">📍 Use my location</button></div>
  </div>
</div>

<div id="loading">Loading the globe…</div>

<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
<script>
// ───────────────── settings ─────────────────
const RELAY = "https://sky-relay.vaibhav-linchon.workers.dev";
const REFRESH_MS = 8000;
const RANGES = [{ nm: 80, km: 150 }, { nm: 150, km: 280 }, { nm: 250, km: 460 }];
const QUICK = [
  { name: "Bengaluru", country: "India", cc: "IN", lat: 12.97, lon: 77.59 },
  { name: "Mumbai", country: "India", cc: "IN", lat: 19.08, lon: 72.88 },
  { name: "Delhi", country: "India", cc: "IN", lat: 28.61, lon: 77.21 },
  { name: "Chennai", country: "India", cc: "IN", lat: 13.08, lon: 80.27 },
  { name: "Hyderabad", country: "India", cc: "IN", lat: 17.39, lon: 78.49 },
  { name: "Dubai", country: "United Arab Emirates", cc: "AE", lat: 25.20, lon: 55.27 },
  { name: "Singapore", country: "Singapore", cc: "SG", lat: 1.35, lon: 103.82 },
  { name: "London", country: "United Kingdom", cc: "GB", lat: 51.51, lon: -0.13 },
  { name: "New York", country: "United States", cc: "US", lat: 40.71, lon: -74.01 },
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : "🌍";
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let place = load("sky.place", QUICK[0]);
let rangeIdx = load("sky.range", 1);
let labelsOn = load("sky.labels", true);
let realLight = load("sky.light", true);

// ───────────────── globe ─────────────────
const C = Cesium;
const viewer = new C.Viewer("globe", {
  baseLayer: false, animation: false, timeline: false, baseLayerPicker: false, geocoder: false,
  homeButton: false, sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, shouldAnimate: true,
  useBrowserRecommendedResolution: false,           // draw at the screen's real sharpness
  msaaSamples: (window.devicePixelRatio || 1) >= 2 ? 2 : 4,
});
const scene = viewer.scene, globe = scene.globe;
let hd = load("sky.hd", true);
function applyQuality() {
  viewer.resolutionScale = hd ? Math.min(window.devicePixelRatio || 1, 2.5) : 1;
  globe.maximumScreenSpaceError = hd ? 1.2 : 2;     // lower = sharper map tiles
  $("bHd").classList.toggle("on", hd);
}
globe.tileCacheSize = 400;
scene.postProcessStages.fxaa.enabled = false;        // FXAA softens text and edges
viewer.clock.clockStep = C.ClockStep.SYSTEM_CLOCK;

const layers = viewer.imageryLayers;
const dayLayer = layers.addImageryProvider(new C.UrlTemplateImageryProvider({
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  maximumLevel: 18, credit: "Imagery © Esri, Maxar, Earthstar Geographics",
}));
const nightLayer = layers.addImageryProvider(new C.UrlTemplateImageryProvider({
  url: "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png",
  maximumLevel: 8, credit: "Night lights © NASA Black Marble",
}));
nightLayer.dayAlpha = 0.0; nightLayer.nightAlpha = 1.0; nightLayer.brightness = 1.15; nightLayer.contrast = 1.25; nightLayer.gamma = 1.15;
const labelLayer = layers.addImageryProvider(new C.UrlTemplateImageryProvider({
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  maximumLevel: 18,
}));
labelLayer.alpha = 0.7;

globe.baseColor = C.Color.fromCssColorString("#0b1730");
globe.showGroundAtmosphere = true;
globe.dynamicAtmosphereLighting = true;
globe.dynamicAtmosphereLightingFromSun = true;
scene.skyAtmosphere.show = true;
scene.fog.enabled = true;
scene.screenSpaceCameraController.minimumZoomDistance = 1500;
scene.screenSpaceCameraController.maximumZoomDistance = 2.5e7;

function applyLight() {
  globe.enableLighting = realLight;
  nightLayer.show = realLight;
  $("bLight").classList.toggle("on", realLight);
  $("bLight").textContent = realLight ? "☀" : "🌤";
}
applyLight();
applyQuality();

// ───────────────── planes ─────────────────
const STOPS = [[0, [255, 138, 61]], [10000, [255, 209, 102]], [20000, [126, 232, 161]], [30000, [56, 189, 248]], [40000, [167, 139, 250]]];
function altColor(ft, ground) {
  if (ground) return "#8892a6";
  ft = Math.max(0, Math.min(40000, ft || 0));
  for (let i = 1; i < STOPS.length; i++) if (ft <= STOPS[i][0]) {
    const [a0, c0] = STOPS[i - 1], [a1, c1] = STOPS[i], k = (ft - a0) / (a1 - a0);
    return "rgb(" + c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(",") + ")";
  }
  return "rgb(167,139,250)";
}
const planes = new Map();
let selected = null;
const BLEND_MS = 2500;
const scratch = new C.Cartesian3();

// Where a plane should be at time t, moving straight at its last speed and heading
function predict(f, t, result) {
  const dt = Math.min(Math.max((t - f.t) / 1000, 0), 300); // keep gliding up to 5 min without fresh data
  const d = f.v * dt, br = f.trk * Math.PI / 180;
  const lat = f.lat + d * Math.cos(br) / 111320;
  const lon = f.lon + d * Math.sin(br) / (111320 * Math.cos(f.lat * Math.PI / 180));
  const alt = Math.max(0, f.alt + (f.vr || 0) * dt);
  return C.Cartesian3.fromDegrees(lon, lat, alt, undefined, result);
}
// Predicted position, plus a correction that fades out so planes glide instead of jumping
function displayPos(p, t, result) {
  const base = predict(p.fix, t, result);
  const k = 1 - (t - p.fixAt) / BLEND_MS;
  if (k > 0) {
    const e = k * k * (3 - 2 * k);
    C.Cartesian3.add(base, C.Cartesian3.multiplyByScalar(p.off, e, scratch), base);
  }
  return base;
}
function northAt(lat, lon) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new C.Cartesian3(-Math.sin(la) * Math.cos(lo), -Math.sin(la) * Math.sin(lo), Math.cos(la));
}

// Tail colours by airline (ICAO callsign prefix). Plain colours only, no logos.
const AIRLINES = {
  IGO: ["IndiGo", "#1d3c9e"], AIC: ["Air India", "#c8102e"], AXB: ["Air India Express", "#e8572a"], AKJ: ["Akasa Air", "#ff6d38"],
  SEJ: ["SpiceJet", "#d71921"], VTI: ["Vistara", "#5b2c6f"], IAD: ["AIX Connect", "#e8572a"], LLR: ["Alliance Air", "#c8102e"],
  UAE: ["Emirates", "#d71a21"], QTR: ["Qatar Airways", "#5c0632"], ETD: ["Etihad", "#b38f4f"], FDB: ["flydubai", "#0e4c92"],
  OMA: ["Oman Air", "#8a6a3b"], GFA: ["Gulf Air", "#a08443"], SVA: ["Saudia", "#00563f"], KAC: ["Kuwait Airways", "#2b4a8b"],
  ABY: ["Air Arabia", "#c8102e"], SIA: ["Singapore Airlines", "#1d2c6b"], MAS: ["Malaysia Airlines", "#0b2c80"], THA: ["Thai Airways", "#5d1f73"],
  CPA: ["Cathay Pacific", "#006564"], JAL: ["Japan Airlines", "#e60012"], ANA: ["ANA", "#13448f"], ALK: ["SriLankan", "#1f4e9a"],
  ETH: ["Ethiopian", "#1f8a3a"], THY: ["Turkish Airlines", "#e30a17"], DLH: ["Lufthansa", "#0a1d3d"], BAW: ["British Airways", "#1c3f94"],
  AFR: ["Air France", "#002157"], KLM: ["KLM", "#00a1de"], UAL: ["United", "#0c2340"], AAL: ["American", "#8e9aa8"],
  FDX: ["FedEx", "#4d148c"], UPS: ["UPS", "#4b2e1e"], BOX: ["AeroLogic", "#d7b200"], BLX: ["Blue Dart", "#1b4d9b"], CLX: ["Cargolux", "#c8102e"],
};
function airlineOf(call) { const a = AIRLINES[(call || "").slice(0, 3).toUpperCase()]; return a ? { name: a[0], color: a[1] } : null; }
// One shader per tail colour. It repaints the blue tail of the model and keeps the
// plane lit a little on the night side, so it never turns into a black shape.
const shaderCache = {};
function planeShader(hex) {
  hex = hex || "#1a4795";
  if (!shaderCache[hex]) {
    const c = C.Color.fromCssColorString(hex);
    const lin = v => Math.pow(v, 2.2);
    shaderCache[hex] = new C.CustomShader({
      uniforms: { u_tail: { type: C.UniformType.VEC3, value: new C.Cartesian3(lin(c.red), lin(c.green), lin(c.blue)) } },
      fragmentShaderText: `void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
        vec3 d = material.diffuse;
        if (d.b > d.r + 0.2 && d.b > d.g + 0.15) material.diffuse = u_tail;
        material.emissive += material.diffuse * 0.32;
      }`,
    });
  }
  return shaderCache[hex];
}
// Soft glowing halo in the altitude colour, drawn behind the plane when seen from afar
const haloCache = {};
function halo(color) {
  if (!haloCache[color]) {
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><defs><radialGradient id='h'><stop offset='0' stop-color='${color}' stop-opacity='.95'/><stop offset='.25' stop-color='${color}' stop-opacity='.55'/><stop offset='.6' stop-color='${color}' stop-opacity='.15'/><stop offset='1' stop-color='${color}' stop-opacity='0'/></radialGradient></defs><circle cx='64' cy='64' r='64' fill='url(#h)'/><circle cx='64' cy='64' r='30' fill='none' stroke='${color}' stroke-opacity='.9' stroke-width='3'/></svg>`;
    haloCache[color] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }
  return haloCache[color];
}
const STROBE_WHITE = C.Color.WHITE, BEACON_RED = C.Color.fromCssColorString("#ff3b30"), DARK = C.Color.TRANSPARENT;
// Nose follows the track, pitches with climb/descent, banks in turns
const hprScratch = new C.HeadingPitchRoll();
function planeOrientation(p) {
  const f = p.fix;
  const target = f.v > 20 ? Math.max(-0.26, Math.min(0.26, Math.atan2((f.vr || 0), f.v))) : 0;
  p.pitch += (target - p.pitch) * 0.05;
  p.roll += (p.rollTarget - p.roll) * 0.04;
  hprScratch.heading = C.Math.toRadians(f.trk);
  hprScratch.pitch = p.pitch;
  hprScratch.roll = p.roll;
  return C.Transforms.headingPitchRollQuaternion(p.pos, hprScratch);
}

function addPlane(q, fix) {
  const p = { id: q.id, fix, fixAt: Date.now(), off: new C.Cartesian3(), trail: [], miss: 0, q, pitch: 0, roll: 0, rollTarget: 0, phase: Math.random() * 1300 };
  p.airline = airlineOf(q.call);
  p.north = northAt(fix.lat, fix.lon);
  p.color = altColor(q.altFt, q.ground);
  p.pos = new C.Cartesian3();
  const posProp = new C.CallbackProperty(() => displayPos(p, Date.now(), p.pos), false);
  p.ent = viewer.entities.add({
    id: q.id,
    position: posProp,
    orientation: new C.CallbackProperty(() => planeOrientation(p), false),
    model: {
      uri: "plane.glb",
      minimumPixelSize: new C.CallbackProperty(() => (selected === p.id ? 96 : 64) * (p.q.ground ? 0.6 : 1), false),
      maximumScale: 3000,
      silhouetteColor: C.Color.WHITE.withAlpha(0.9),
      silhouetteSize: new C.CallbackProperty(() => selected === p.id && following !== p.id ? 2 : 0, false),
      customShader: planeShader(p.airline && p.airline.color),
    },
    // pulsing halo: fully visible from far away, fades out as you zoom in on the plane
    billboard: {
      image: new C.CallbackProperty(() => halo(p.color), false),
      scale: new C.CallbackProperty(() => (p.q.ground ? 0.3 : 0.55) * (1 + 0.16 * Math.sin((Date.now() + p.phase) / 520)), false),
      eyeOffset: new C.Cartesian3(0, 0, 400),
      translucencyByDistance: new C.NearFarScalar(1.5e4, 0.0, 9e4, 1.0),
    },
    // anti-collision lights: white strobe double-flash and a red beacon
    point: {
      pixelSize: 5,
      color: new C.CallbackProperty(() => {
        const t = (Date.now() + p.phase) % 1300;
        return (t < 60 || (t > 150 && t < 210)) ? STROBE_WHITE : (t > 650 && t < 780 ? BEACON_RED : DARK);
      }, false),
      outlineWidth: 0,
      distanceDisplayCondition: new C.DistanceDisplayCondition(2500, Number.POSITIVE_INFINITY),
    },
    label: {
      text: q.call || q.id, font: "600 13px system-ui, sans-serif",
      fillColor: C.Color.WHITE, outlineColor: C.Color.fromCssColorString("#05080f"), outlineWidth: 3,
      style: C.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new C.Cartesian2(0, -24),
      distanceDisplayCondition: new C.DistanceDisplayCondition(0, 6e5), show: labelsOn && !q.ground,
    },
  });
  if (!q.ground) {
    p.trailEnt = viewer.entities.add({
      id: q.id + "#trail",
      polyline: {
        positions: new C.CallbackProperty(() => p.trail.length ? p.trail.concat([p.pos]) : [], false),
        width: new C.CallbackProperty(() => (p.q.altFt || 0) >= 26000 ? 10 : 7, false),
        material: new C.PolylineGlowMaterialProperty({
          glowPower: new C.CallbackProperty(() => (p.q.altFt || 0) >= 26000 ? 0.18 : 0.35, false), taperPower: 0.6,
          color: new C.CallbackProperty(() => (p.q.altFt || 0) >= 26000 ? C.Color.fromCssColorString("#eaf4ff").withAlpha(0.6) : C.Color.fromCssColorString(p.color).withAlpha(0.9), false),
        }),
      },
    });
    p.dropEnt = viewer.entities.add({
      id: q.id + "#drop",
      polyline: {
        positions: new C.CallbackProperty(() => {
          const c = C.Cartographic.fromCartesian(p.pos);
          return [p.pos, C.Cartesian3.fromRadians(c.longitude, c.latitude, 0)];
        }, false),
        width: 1,
        material: new C.PolylineDashMaterialProperty({ color: C.Color.WHITE.withAlpha(0.3), dashLength: 12 }),
        distanceDisplayCondition: new C.DistanceDisplayCondition(0, 4e5),
      },
    });
  }
  planes.set(q.id, p);
}

function removePlane(p) {
  viewer.entities.remove(p.ent);
  if (p.trailEnt) viewer.entities.remove(p.trailEnt);
  if (p.dropEnt) viewer.entities.remove(p.dropEnt);
  planes.delete(p.id);
  if (selected === p.id) closeCard();
}
function clearPlanes() { [...planes.values()].forEach(removePlane); }

// Record trail points once a second (about 2 minutes of trail)
setInterval(() => {
  for (const p of planes.values()) {
    if (p.q.ground || !p.trailEnt) continue;
    p.trail.push(C.Cartesian3.clone(p.pos));
    if (p.trail.length > 120) p.trail.shift();
  }
}, 1000);

let lastDataTime = 0, lastOkAt = 0, source = "", fetching = false, lastProblem = "";
function applyData(data) {
  if (!data.planes) return;
  if (data.time && data.time === lastDataTime) return; // same snapshot as before
  lastDataTime = data.time || Date.now();
  const now = Date.now(), seen = new Set();
  for (const q of data.planes) {
    if (q.lat == null || q.lon == null || !q.id) continue;
    seen.add(q.id);
    const fix = { lat: q.lat, lon: q.lon, alt: q.ground ? 0 : Math.max(0, (q.altFt || 0) * 0.3048), v: (q.kts || 0) * 0.5144, trk: q.track || 0, vr: q.ground ? 0 : (q.vr || 0) * 0.00508, t: Math.min(lastDataTime, now) };
    const p = planes.get(q.id);
    if (!p) { addPlane(q, fix); continue; }
    const dtFix = (fix.t - p.fix.t) / 1000;
    if (dtFix > 1) {
      const dTrk = ((fix.trk - p.fix.trk + 540) % 360) - 180;          // degrees turned, -180..180
      const omega = C.Math.toRadians(dTrk) / dtFix;                     // turn rate rad/s
      p.rollTarget = Math.max(-0.5, Math.min(0.5, Math.atan(fix.v * omega / 9.81)));
    }
    const cur = displayPos(p, now, new C.Cartesian3());
    p.fix = fix; p.fixAt = now; p.q = q; p.miss = 0;
    const base = predict(fix, now, new C.Cartesian3());
    C.Cartesian3.subtract(cur, base, p.off);
    if (C.Cartesian3.magnitude(p.off) > 20000) { p.off = new C.Cartesian3(); p.trail = []; }
    p.north = northAt(fix.lat, fix.lon);
    const col = altColor(q.altFt, q.ground);
    p.color = col;
    p.ent.label.text = q.call || q.id;
    if (!p.airline && q.call) { p.airline = airlineOf(q.call); if (p.airline) p.ent.model.customShader = planeShader(p.airline.color); }
  }
  for (const p of [...planes.values()]) if (!seen.has(p.id) && ++p.miss >= 3) removePlane(p);
  source = data.source || "";
  lastOkAt = Date.now();
}

async function poll() {
  if (fetching || document.hidden) return;
  fetching = true;
  try {
    const r = await fetch(`${RELAY}/?lat=${place.lat.toFixed(2)}&lon=${place.lon.toFixed(2)}&dist=${RANGES[rangeIdx].nm}`);
    const data = await r.json();
    if (data.planes) { applyData(data); lastProblem = ""; }
    else lastProblem = "Feeds busy" + (data.errors ? " (" + data.errors.map(x => x.split(":")[0] + " " + (x.match(/HTTP \d+|timed out|failed/) || [""])[0]).join(", ") + ")" : "") + " · retrying";
  } catch (e) { lastProblem = "Can't reach your relay · retrying"; }
  fetching = false;
  updateStatus();
}
function updateStatus() {
  const n = [...planes.values()].filter(p => !p.q.ground).length, g = planes.size - n;
  const age = lastOkAt ? Math.round((Date.now() - Math.min(lastOkAt, lastDataTime || lastOkAt)) / 1000) : null;
  const live = lastOkAt && (Date.now() - (lastDataTime || lastOkAt)) < 30000;
  $("dot").classList.toggle("live", !!live);
  $("status").textContent = !lastOkAt ? (lastProblem || "Finding planes…")
    : `${n} flying${g ? " · " + g + " on ground" : ""} · ${age > 30 ? "feed paused " + age + "s, planes estimated" : "live via " + source}`;
}
setInterval(updateStatus, 2000);
setInterval(poll, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

// ───────────────── camera ─────────────────
function flyHome(duration = 2.5) {
  const km = RANGES[rangeIdx].km;
  const h = Math.max(120000, km * 1000 * 0.9);
  const back = (h / Math.tan(C.Math.toRadians(40))) / 111320;
  viewer.camera.flyTo({
    destination: C.Cartesian3.fromDegrees(place.lon, place.lat - back, h),
    orientation: { heading: 0, pitch: C.Math.toRadians(-40), roll: 0 }, duration,
  });
}
let homeMark = null;
function setPlace(p, fly = true) {
  stopCine(); unfollow(); stopSky();
  const changed = !place || Math.abs(p.lat - place.lat) > 0.01 || Math.abs(p.lon - place.lon) > 0.01;
  place = { name: p.name, country: p.country || "", cc: p.cc || "", lat: +p.lat, lon: +p.lon };
  save("sky.place", place);
  $("placeName").textContent = place.name;
  document.title = "Sky Live · " + place.name;
  if (homeMark) viewer.entities.remove(homeMark);
  homeMark = viewer.entities.add({
    position: C.Cartesian3.fromDegrees(place.lon, place.lat, 0),
    point: { pixelSize: 9, color: C.Color.fromCssColorString("#fbbf24"), outlineColor: C.Color.WHITE.withAlpha(0.8), outlineWidth: 2 },
  });
  if (changed) { clearPlanes(); lastDataTime = 0; lastOkAt = 0; }
  if (fly) flyHome();
  poll();
}

// ───────────────── tap a plane ─────────────────
const handler = new C.ScreenSpaceEventHandler(scene.canvas);
handler.setInputAction(e => {
  const o = scene.pick(e.position);
  const id = o && o.id && o.id.id ? String(o.id.id).split("#")[0] : null;
  if (id && planes.has(id)) { stopCine(); openCard(id); } else if (!following) closeCard();
}, C.ScreenSpaceEventType.LEFT_CLICK);

const COMPASS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
function openCard(id) { if (following && following !== id) unfollow(); $("caption").classList.remove("on"); selected = id; $("cFly").textContent = following === id ? "✋ Stop following" : "🎥 Follow"; $("card").classList.add("on"); fillCard(); }
function closeCard() { if (!cine) unfollow(); selected = null; $("card").classList.remove("on"); }
function fillCard() {
  const p = planes.get(selected); if (!p) return closeCard();
  const q = p.q;
  $("cCs").textContent = q.call || q.id.toUpperCase();
  $("cTy").textContent = [p.airline && p.airline.name, q.type].filter(Boolean).join(" · ") || "Aircraft";
  const arrow = q.vr > 300 ? " ↑" : q.vr < -300 ? " ↓" : "";
  $("cAlt").textContent = q.ground ? "Ground" : (q.altFt != null ? q.altFt.toLocaleString() + " ft" + arrow : "—");
  $("cSpd").textContent = q.kts != null ? Math.round(q.kts * 1.852) + " km/h" : "—";
  $("cHdg").textContent = Math.round(q.track || 0) + "° " + COMPASS[Math.round((q.track || 0) / 45) % 8];
}
setInterval(() => { if (selected) fillCard(); }, 1000);
$("cX").onclick = closeCard;
// ───────────────── chase camera ─────────────────
// Sits behind the tail and swings round with the plane in turns. You can still drag to look
// around or pinch to zoom; it eases back behind the tail afterwards.
let following = null, chase = null;
const enuScratch = new C.Matrix4(), invScratch = new C.Matrix4(), offScratch = new C.Cartesian3(), tgtScratch = new C.Cartesian3();
// Camera's heading/pitch/range around a point (the point the camera was locked on last frame,
// so the user's drags and pinches since then are kept, and the plane's own motion is not)
function camOffsetAround(center) {
  C.Transforms.eastNorthUpToFixedFrame(center, undefined, enuScratch);
  C.Matrix4.inverseTransformation(enuScratch, invScratch);
  const local = C.Matrix4.multiplyByPoint(invScratch, viewer.camera.positionWC, offScratch);
  const range = C.Cartesian3.magnitude(local) || 200;
  return { heading: Math.atan2(-local.x, -local.y), pitch: -Math.asin(Math.max(-1, Math.min(1, local.z / range))), range };
}
function startChase(id, opts = {}) {
  const p = planes.get(id); if (!p) return;
  stopSky();
  following = id;
  chase = { range: opts.range || (p.q.ground ? 60 : 85), pitch: C.Math.toRadians(-9), orbit: !!opts.orbit, t0: Date.now() };
  // glide in from wherever the camera is, then lock on
  const ahead = displayPos(p, Date.now() + 2500, new C.Cartesian3());
  viewer.camera.flyToBoundingSphere(new C.BoundingSphere(ahead, 40), {
    offset: new C.HeadingPitchRange(C.Math.toRadians(p.fix.trk), chase.pitch, chase.range),
    duration: opts.duration ?? 2.5,
    complete: () => { if (following === id) chase.locked = true; },
  });
  $("cFly").textContent = "✋ Stop following";
}
function unfollow() {
  if (!following) return;
  following = null; chase = null;
  viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
  $("cFly").textContent = "🎥 Follow";
}
scene.preRender.addEventListener(() => {
  if (!following || !chase || !chase.locked) return;
  const p = planes.get(following); if (!p) { unfollow(); return; }
  const cur = camOffsetAround(chase.last || displayPos(p, Date.now(), new C.Cartesian3()));
  displayPos(p, Date.now(), tgtScratch);
  let wantH = C.Math.toRadians(p.fix.trk), wantP = cur.pitch, range = cur.range;
  if (!chase.orbit && !chase.settled) { range = chase.range; wantP = chase.pitch; if (Math.abs(cur.range - chase.range) < 5) chase.settled = true; }
  if (chase.orbit) {   // cinematic: slow swing from behind to the side and back, gentle zoom
    const k = (Date.now() - chase.t0) / 1000;
    wantH += Math.sin(k / 7) * 1.1;
    wantP = C.Math.toRadians(-6 - 10 * (0.5 + 0.5 * Math.sin(k / 9)));
    range = chase.range * (0.85 + 0.35 * (0.5 + 0.5 * Math.cos(k / 11)));
  }
  const dh = C.Math.negativePiToPi(wantH - cur.heading);
  const heading = cur.heading + dh * 0.04;
  const pitch = Math.max(-1.45, Math.min(0.35, cur.pitch + (wantP - cur.pitch) * 0.05));
  range = Math.max(40, Math.min(5000, cur.range + (range - cur.range) * 0.05));
  viewer.camera.lookAt(tgtScratch, new C.HeadingPitchRange(heading, pitch, range));
  chase.last = C.Cartesian3.clone(tgtScratch, chase.last);
});
$("cFly").onclick = () => { stopCine(); following === selected ? unfollow() : startChase(selected); };

// ───────────────── cinematic tour ─────────────────
let cine = false, cineTimer = null;
const recent = [];
function describe(p) {
  const q = p.q, ft = q.altFt || 0, vr = q.vr || 0;
  const near = C.Cartesian3.distance(p.pos, C.Cartesian3.fromDegrees(place.lon, place.lat, 0)) < 60000;
  if (ft < 12000 && vr < -400) return near ? `Landing at ${place.name}` : "Coming in to land";
  if (ft < 15000 && vr > 400) return near ? `Departing ${place.name}` : "Climbing out";
  if (vr > 400) return `Climbing through ${ft.toLocaleString()} ft`;
  if (vr < -400) return `Descending through ${ft.toLocaleString()} ft`;
  return `Cruising at ${ft.toLocaleString()} ft`;
}
function pickInteresting() {
  const list = [...planes.values()].filter(p => !p.q.ground && p.trailEnt);
  if (!list.length) return null;
  const score = p => {
    const ft = p.q.altFt || 0, vr = Math.abs(p.q.vr || 0);
    let s = Math.random();
    if (ft < 12000 && vr > 400) s += 3;          // take-offs and landings are the most fun
    if (ft > 36000) s += 1.5;                      // high cruisers with contrails
    if ((p.q.kts || 0) > 500) s += 1;
    if (p.airline) s += 0.5;
    if (recent.includes(p.id)) s -= 5;
    return s;
  };
  return list.sort((a, b) => score(b) - score(a))[0].id;
}
function showCaption(p) {
  const a = p.airline ? p.airline.name : "Flight";
  $("capA").textContent = [a, p.q.type].filter(Boolean).join(" · ");
  $("capB").textContent = p.q.call || p.id.toUpperCase();
  $("capC").textContent = `${describe(p)} · ${Math.round((p.q.kts || 0) * 1.852)} km/h`;
  $("caption").classList.remove("on"); void $("caption").offsetWidth; $("caption").classList.add("on");
}
function cineNext() {
  if (!cine) return;
  const id = pickInteresting();
  if (!id) { cineTimer = setTimeout(cineNext, 3000); return; }
  recent.push(id); if (recent.length > 6) recent.shift();
  selected = null; $("card").classList.remove("on");
  unfollow();
  startChase(id, { orbit: true, range: 115, duration: 3.5 });
  showCaption(planes.get(id));
  cineTimer = setTimeout(cineNext, 24000);
}
function startCine() { stopSky(); cine = true; $("bCine").classList.add("on"); cineNext(); }
function stopCine() {
  if (!cine) return;
  cine = false; clearTimeout(cineTimer); $("bCine").classList.remove("on"); $("caption").classList.remove("on");
}
$("bCine").onclick = () => { if (cine) { stopCine(); unfollow(); flyHome(); } else startCine(); };
setInterval(() => { if (cine && following && planes.get(following)) $("capC").textContent = `${describe(planes.get(following))} · ${Math.round((planes.get(following).q.kts || 0) * 1.852)} km/h`; }, 2000);

// ───────────────── sky view: stand in your city and look up ─────────────────
let skyOn = false;
function startSky() {
  stopCine(); unfollow(); closeCard();
  skyOn = true; $("bSky").classList.add("on");
  // face the nearest plane in the air, tilted up to where it appears in the sky
  const eye = C.Cartesian3.fromDegrees(place.lon, place.lat, 60);
  let heading = 0, pitch = C.Math.toRadians(12), best = Infinity;
  const enu = C.Transforms.eastNorthUpToFixedFrame(eye), inv = C.Matrix4.inverseTransformation(enu, new C.Matrix4());
  for (const pl of planes.values()) {
    if (pl.q.ground) continue;
    const l = C.Matrix4.multiplyByPoint(inv, pl.pos, new C.Cartesian3()), d = C.Cartesian3.magnitude(l);
    if (d < best) { best = d; heading = Math.atan2(l.x, l.y); pitch = Math.asin(l.z / d); }
  }
  pitch = Math.max(C.Math.toRadians(4), Math.min(C.Math.toRadians(70), pitch + C.Math.toRadians(3)));
  viewer.camera.flyTo({ destination: eye, orientation: { heading, pitch, roll: 0 }, duration: 3 });
}
function stopSky() { if (!skyOn) return; skyOn = false; $("bSky").classList.remove("on"); }
$("bSky").onclick = () => { if (skyOn) { stopSky(); flyHome(); } else startSky(); };

// ───────────────── engine sound (off until you turn it on) ─────────────────
let audio = null, soundOn = false;
function initAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } // brown noise = jet rumble
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300;
  const whine = ac.createOscillator(); whine.type = "sawtooth"; whine.frequency.value = 1900;
  const wf = ac.createBiquadFilter(); wf.type = "bandpass"; wf.frequency.value = 1900; wf.Q.value = 8;
  const wg = ac.createGain(); wg.gain.value = 0;
  const g = ac.createGain(); g.gain.value = 0;
  src.connect(lp).connect(g).connect(ac.destination);
  whine.connect(wf).connect(wg).connect(ac.destination);
  src.start(); whine.start();
  return { ac, g, lp, wg };
}
$("bSound").onclick = () => {
  soundOn = !soundOn;
  if (soundOn && !audio) audio = initAudio();
  if (audio) soundOn ? audio.ac.resume() : audio.ac.suspend();
  $("bSound").textContent = soundOn ? "🔊" : "🔇"; $("bSound").classList.toggle("on", soundOn);
};
setInterval(() => {
  if (!audio || !soundOn) return;
  let best = Infinity;
  for (const p of planes.values()) if (!p.q.ground) best = Math.min(best, C.Cartesian3.distance(viewer.camera.positionWC, p.pos));
  const k = Math.max(0, 1 - best / 6000);              // loud within a few hundred metres, silent beyond 6 km
  const t = audio.ac.currentTime;
  audio.g.gain.setTargetAtTime(0.55 * k * k, t, 0.3);
  audio.lp.frequency.setTargetAtTime(220 + 900 * k, t, 0.3);
  audio.wg.gain.setTargetAtTime(0.012 * k * k * k, t, 0.3);
}, 200);

// ───────────────── controls ─────────────────
$("rangeTxt").textContent = RANGES[rangeIdx].km + "km";
$("bLabels").classList.toggle("on", labelsOn);
$("bHome").onclick = () => { stopCine(); unfollow(); stopSky(); flyHome(); };
$("bRange").onclick = () => {
  stopCine(); unfollow(); stopSky();
  rangeIdx = (rangeIdx + 1) % RANGES.length; save("sky.range", rangeIdx);
  $("rangeTxt").textContent = RANGES[rangeIdx].km + "km";
  flyHome(1.5); poll();
};
$("bLabels").onclick = () => {
  labelsOn = !labelsOn; save("sky.labels", labelsOn);
  $("bLabels").classList.toggle("on", labelsOn);
  for (const p of planes.values()) p.ent.label.show = labelsOn && !p.q.ground;
};
$("bHd").onclick = () => { hd = !hd; save("sky.hd", hd); applyQuality(); };
$("bLight").onclick = () => { realLight = !realLight; save("sky.light", realLight); applyLight(); };

// ───────────────── place picker ─────────────────
const picker = $("picker");
$("hud").onclick = () => { picker.classList.add("on"); $("q").value = ""; $("res").innerHTML = ""; setTimeout(() => $("q").focus(), 50); };
picker.onclick = e => { if (e.target === picker) picker.classList.remove("on"); };
function choose(p) { picker.classList.remove("on"); setPlace(p); }
$("chips").innerHTML = QUICK.map((c, i) => `<button class="chip" data-i="${i}">${flag(c.cc)} ${esc(c.name)}</button>`).join("");
$("chips").onclick = e => { const b = e.target.closest("[data-i]"); if (b) choose(QUICK[+b.dataset.i]); };
let results = [], searchT;
$("q").oninput = () => {
  clearTimeout(searchT);
  const term = $("q").value.trim();
  if (term.length < 2) { $("res").innerHTML = ""; return; }
  searchT = setTimeout(async () => {
    try {
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&format=json&name=" + encodeURIComponent(term));
      const d = await r.json();
      results = (d.results || []).map(x => ({ name: x.name, country: x.country || "", region: x.admin1 || "", cc: x.country_code || "", lat: x.latitude, lon: x.longitude }));
      $("res").innerHTML = results.length ? results.map((x, i) =>
        `<div class="opt" data-i="${i}"><span class="f">${flag(x.cc)}</span><div><div class="n">${esc(x.name)}</div><div class="c">${esc([x.region, x.country].filter(Boolean).join(", "))}</div></div></div>`).join("")
        : `<div class="opt"><div class="c">No places found</div></div>`;
    } catch (e) { $("res").innerHTML = `<div class="opt"><div class="c">Search unavailable right now</div></div>`; }
  }, 300);
};
$("res").onclick = e => { const o = e.target.closest("[data-i]"); if (o) choose(results[+o.dataset.i]); };
$("useLoc").onclick = () => {
  if (!navigator.geolocation) return;
  $("useLoc").textContent = "📍 Finding you…";
  navigator.geolocation.getCurrentPosition(
    pos => { $("useLoc").textContent = "📍 Use my location"; choose({ name: "My location", country: "", cc: "", lat: pos.coords.latitude, lon: pos.coords.longitude }); },
    () => { $("useLoc").textContent = "📍 Location not allowed"; },
    { timeout: 10000 }
  );
};

// ───────────────── start ─────────────────
viewer.camera.setView({ destination: C.Cartesian3.fromDegrees(place.lon, place.lat - 10, 2.2e7) });
setTimeout(() => { $("loading").classList.add("gone"); setPlace(place, false); flyHome(4); }, 700);
</script>
</body>
</html>
